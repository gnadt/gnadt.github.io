name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install Python # needed for pre-rendering
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: 1
    # highlight.js is needed for pre-rendering
    # optimize() should be last, consider providing arguments
    - run: julia -e '
            using Pkg;
            Pkg.add(["Franklin", "NodeJS"]);
            using Franklin, NodeJS;
            run(`$(npm_cmd()) install highlight.js`);
            Pkg.activate(".");
            Pkg.instantiate();
            optimize()'
    - name: Build and Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: __site
